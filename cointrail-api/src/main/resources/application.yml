spring:
  application:
    name: cointrail-api

  datasource:
    url: jdbc:postgresql://localhost:5432/cointrail
    username: cointrail
    password: cointrail
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.deepak.cointrailapi: DEBUG

server:
  port: 8081