spring:
  application:
    name: cointrail-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cointrail}
    username: ${DB_USERNAME:cointrail}
    password: ${DB_PASSWORD:cointrail}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.deepak.cointrailapi: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: CoinTrail API
    description: Personal Finance and Expense Tracker API
    version: 1.0.0

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

app:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  recurring:
    timezone: ${RECURRING_TIMEZONE}
    enabled: ${RECURRING_ENABLED:false}
    poll-interval: ${RECURRING_POLL_INTERVAL:PT1M}
    template-batch-size: ${RECURRING_TEMPLATE_BATCH_SIZE:100}
    occurrence-batch-size: ${RECURRING_OCCURRENCE_BATCH_SIZE:50}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server:
  port: 8081

springdoc:
  api-docs:
    enabled: ${app.api-docs.enabled}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${app.api-docs.enabled}
    path: /swagger-ui.html
    persist-authorization: false
    validator-url: ""
  override-with-generic-response: false
  packages-to-scan:
    - com.deepak.cointrailapi.auth
    - com.deepak.cointrailapi.account
    - com.deepak.cointrailapi.category
    - com.deepak.cointrailapi.transaction
    - com.deepak.cointrailapi.budget
    - com.deepak.cointrailapi.recurringtransaction
    - com.deepak.cointrailapi.dashboard
    - com.deepak.cointrailapi.analytics
